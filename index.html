<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Recepción de Materiales</title>
    <!-- Tailwind CSS para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería SheetJS para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Encabezado -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="package-check" class="text-indigo-600"></i>
                    Control de Recepción de Materiales
                </h1>
                <p class="text-sm text-slate-500 mt-1">Captura de folios, materiales y exportación directa a Excel</p>
            </div>
            <button onclick="exportarAExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-lg shadow transition flex items-center gap-2 text-sm">
                <i data-lucide="file-spreadsheet"></i>
                Exportar a Excel (.xlsx)
            </button>
        </header>

        <!-- Indicadores rápidos -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-400">Total Recepciones</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg"><i data-lucide="layers"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-400">Piezas / Unidades</p>
                    <p id="statPiezas" class="text-2xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="boxes"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-400">Último Folio</p>
                    <p id="statUltimoFolio" class="text-2xl font-bold text-slate-800 mt-1">---</p>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="hash"></i></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Formulario de captura -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1 h-fit">
                <h2 class="text-lg font-semibold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="text-indigo-600"></i>
                    Nuevo Registro
                </h2>
                
                <form id="registroForm" onsubmit="agregarRegistro(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 uppercase mb-1">Folio / Remisión *</label>
                        <input type="text" id="folio" required placeholder="Ej: REC-2026-001" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-700 uppercase mb-1">Proveedor / Origen *</label>
                        <input type="text" id="proveedor" required placeholder="Ej: Logística Central" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-700 uppercase mb-1">Descripción del Material *</label>
                        <textarea id="descripcion" required rows="2" placeholder="Ej: Caja de insumos con QR de verificación..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 uppercase mb-1">Cantidad *</label>
                            <input type="number" id="cantidad" min="1" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 uppercase mb-1">Estado</label>
                            <select id="estado" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="Recibido Completo">Recibido Completo</option>
                                <option value="Pendiente Revisión">Pendiente Revisión</option>
                                <option value="Con Inconsistencia">Con Inconsistencia</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2 text-sm mt-2">
                        <i data-lucide="save"></i>
                        Guardar Registro
                    </button>
                </form>
            </div>

            <!-- Tabla de datos -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i data-lucide="list" class="text-indigo-600"></i>
                        Historial de Recepciones
                    </h2>
                    <div class="relative w-full sm:w-64">
                        <i data-lucide="search" class="absolute left-3 top-2.5 text-slate-400 w-4 h-4"></i>
                        <input type="text" id="buscador" oninput="filtrarTabla()" placeholder="Buscar por folio o proveedor..." class="w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="overflow-x-auto border border-slate-200 rounded-lg">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-slate-700 font-medium uppercase text-xs border-b border-slate-200">
                            <tr>
                                <th class="p-3">Folio</th>
                                <th class="p-3">Fecha/Hora</th>
                                <th class="p-3">Proveedor</th>
                                <th class="p-3">Material</th>
                                <th class="p-3 text-center">Cant.</th>
                                <th class="p-3">Estado</th>
                                <th class="p-3 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo" class="divide-y divide-slate-200">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let registros = JSON.parse(localStorage.getItem('registros_recepcion') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            renderizar();
            lucide.createIcons();
        });

        function guardarEnLocalStorage() {
            localStorage.setItem('registros_recepcion', JSON.stringify(registros));
            renderizar();
        }

        function agregarRegistro(e) {
            e.preventDefault();
            const nuevo = {
                id: Date.now(),
                folio: document.getElementById('folio').value.trim(),
                proveedor: document.getElementById('proveedor').value.trim(),
                descripcion: document.getElementById('descripcion').value.trim(),
                cantidad: parseInt(document.getElementById('cantidad').value) || 1,
                estado: document.getElementById('estado').value,
                fecha: new Date().toLocaleString('es-MX')
            };

            registros.unshift(nuevo);
            guardarEnLocalStorage();
            document.getElementById('registroForm').reset();
            document.getElementById('cantidad').value = "1";
        }

        function eliminarRegistro(id) {
            if (confirm('¿Deseas borrar este registro?')) {
                registros = registros.filter(item => item.id !== id);
                guardarEnLocalStorage();
            }
        }

        function renderizar(filtrados = null) {
            const datos = filtrados || registros;
            const cuerpo = document.getElementById('tablaCuerpo');
            cuerpo.innerHTML = '';

            if (datos.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">No hay registros guardados.</td></tr>`;
            } else {
                datos.forEach(item => {
                    let badgeColor = 'bg-slate-100 text-slate-700';
                    if (item.estado === 'Recibido Completo') badgeColor = 'bg-emerald-100 text-emerald-800';
                    if (item.estado === 'Pendiente Revisión') badgeColor = 'bg-amber-100 text-amber-800';
                    if (item.estado === 'Con Inconsistencia') badgeColor = 'bg-rose-100 text-rose-800';

                    cuerpo.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 font-semibold text-slate-900">${item.folio}</td>
                            <td class="p-3 text-xs text-slate-500">${item.fecha}</td>
                            <td class="p-3">${item.proveedor}</td>
                            <td class="p-3">${item.descripcion}</td>
                            <td class="p-3 text-center font-bold">${item.cantidad}</td>
                            <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-medium ${badgeColor}">${item.estado}</span></td>
                            <td class="p-3 text-center">
                                <button onclick="eliminarRegistro(${item.id})" class="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50 transition">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            // Actualizar Estadísticas
            document.getElementById('statTotal').innerText = registros.length;
            document.getElementById('statPiezas').innerText = registros.reduce((acc, curr) => acc + curr.cantidad, 0);
            document.getElementById('statUltimoFolio').innerText = registros.length > 0 ? registros[0].folio : '---';
            lucide.createIcons();
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const filtrados = registros.filter(r => 
                r.folio.toLowerCase().includes(query) || 
                r.proveedor.toLowerCase().includes(query) ||
                r.descripcion.toLowerCase().includes(query)
            );
            renderizar(filtrados);
        }

        function exportarAExcel() {
            if (registros.length === 0) {
                alert('No hay información guardada para exportar.');
                return;
            }

            const datosExcel = registros.map(r => ({
                "Folio": r.folio,
                "Fecha de Registro": r.fecha,
                "Proveedor / Origen": r.proveedor,
                "Descripción Material": r.descripcion,
                "Cantidad": r.cantidad,
                "Estado": r.estado
            }));

            const worksheet = XLSX.utils.json_to_sheet(datosExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Recepciones");
            XLSX.writeFile(workbook, `Recepcion_Materiales_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
